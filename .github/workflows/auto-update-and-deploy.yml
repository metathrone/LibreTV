name: Auto Sync & Deploy to Cloudflare Workers

on:
  schedule:
    - cron: '0 5 * * *'  # 每天 UTC 05:00 (北京时间 13:00) 自动检查上游更新
  workflow_dispatch:     # 支持手动一键触发更新与部署
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'open-next.config.ts'
      - 'wrangler.jsonc'
      - '.github/workflows/auto-update-and-deploy.yml'

permissions:
  contents: write

jobs:
  sync-and-deploy:
    name: Sync Upstream & Deploy to CF Workers
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔄 同步上游代码 (Sync Upstream)
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/LibreSpark/LibreTV.git 2>/dev/null || true
          git fetch upstream main

          # 备份自定义配置
          cp open-next.config.ts /tmp/open-next.config.ts.bak 2>/dev/null || true
          cp wrangler.jsonc /tmp/wrangler.jsonc.bak 2>/dev/null || true

          # 检查上游是否有新提交
          UPSTREAM_DIFF=$(git rev-list HEAD..upstream/main --count)
          echo "上游领先提交数: $UPSTREAM_DIFF"

          if [ "$UPSTREAM_DIFF" -gt 0 ]; then
            echo "发现上游更新，正在合并..."
            git merge upstream/main --no-edit || {
              echo "检测到冲突，优先保留自定义配置文件..."
              git checkout --ours open-next.config.ts wrangler.jsonc .github/workflows/ || true
              git add -A
              git commit -m "chore: 解决上游合并冲突" || true
            }

            # 恢复自定义配置文件
            [ -f /tmp/open-next.config.ts.bak ] && cp /tmp/open-next.config.ts.bak open-next.config.ts
            [ -f /tmp/wrangler.jsonc.bak ] && cp /tmp/wrangler.jsonc.bak wrangler.jsonc

            git add open-next.config.ts wrangler.jsonc
            git commit -m "chore: 同步上游更新并保留 Cloudflare Workers 配置 [skip ci]" || true
            git push origin main
          else
            echo "当前代码已是最新，无需合并。"
          fi

      - name: ⚙️ 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 安装项目依赖
        run: npm install

      - name: 🔨 OpenNext 编译 Cloudflare Worker
        run: npx @opennextjs/cloudflare build

      - name: 🚀 部署到 Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: 🎉 部署完成提示
        run: |
          echo "===================================================="
          echo "🎉 LibreTV 已成功部署到 Cloudflare Workers!"
          echo "🌐 自定义域名: https://tv.rushia.eu.org"
          echo "===================================================="
